name: Build unsigned IPA for TrollStore

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 查看 Xcode 版本
        run: xcodebuild -version

      - name: 构建未签名 .ipa
        run: |
          chmod +x build.sh
          bash build.sh

      - name: 上传 .ipa 附件
        uses: actions/upload-artifact@v4
        with:
          name: CarKey-unsigned-ipa
          path: CarKey-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
